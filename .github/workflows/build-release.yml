yaml
name: Build and Release Android APK
'on':
  push:
    branches:
      - main
  workflow_dispatch:




permissions:
  contents: write




jobs:
  build-and-release:
    runs-on: ubuntu-latest




    steps:
      - name: Kodu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0




      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle




      - name: APK imza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
